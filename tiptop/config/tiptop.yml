# TiPToP Configuration for our DROID lab setup
# Generated by Claude; backup at tiptop.yml.bak

robot:
  type: fr3_robotiq
  dof: 7

  # NUC running our bamboo-polymetis shim
  host: "172.16.0.2"
  port: 5555
  gripper_port: 5559

  # Be CAUTIOUS — start at 0.2 (20% speed)
  time_dilation_factor: 0.2

  # DROID-default home/capture
  q_home: [0.0, -0.628, 0.0, -2.513, 0.0, 1.885, 0.0]
  q_capture: [-0.034, 0.090, 0.080, -1.319, -0.003, 1.253, 0.030]

cameras:
  # fps is kept at 15 (not 30) so three ZEDs fit the USB bandwidth budget — HD720@30 x3
  # triggers "LOW USB BANDWIDTH" on open. The LeRobot export resamples to 15 Hz and aligns
  # camera frames by hardware timestamp, so 15 fps capture loses nothing. If you still see
  # LOW USB BANDWIDTH, drop resolution next (HD720 -> VGA) or move a camera to its own USB3
  # controller. ZED HD720 supports 15/30/60 fps.
  # Serials default to the lab's usual ZEDs. When a camera is swapped for another unit, export
  # TIPTOP_HAND_CAMERA_ID / TIPTOP_EXTERNAL_CAMERA_ID / TIPTOP_EXTERNAL_2_CAMERA_ID instead of
  # editing this file; droid reads the same variables (droid/droid/misc/parameters.py). Any serial
  # you point at needs its own entry in calibration_info.json — extrinsics are keyed by serial.
  #
  # Which camera the perception pipeline (depth -> point cloud -> detection/grasps) reads:
  #   hand      wrist camera. Its pose is only known through the arm, so world_from_cam is
  #             recomputed by forward kinematics at every capture and the arm first drives to
  #             q_capture to aim it at the scene. The gripper is masked out of the point cloud.
  #   external  third-person (side-view) camera. Its pose is static, read straight out of
  #             calibration_info as world_from_cam, so the arm is left at q_home instead of driving
  #             into the shot; the arm is dropped from the cloud by projecting cuRobo's collision
  #             spheres into the frame. q_home should be clear of this camera's view.
  # Either way both cameras are opened and recorded as usual — this only picks which one TAMP
  # perceives through. data-collection sets TIPTOP_PERCEPTION_CAMERA from the top-bar selector.
  perception: "${oc.env:TIPTOP_PERCEPTION_CAMERA,hand}"

  # Hand (wrist) camera
  hand:
    serial: "${oc.env:TIPTOP_HAND_CAMERA_ID,14846828}"
    type: zed
    resolution: HD720
    fps: 15

  # External (side/third-person) camera — recorded as DROID exterior_1, and the camera TAMP
  # perceives through when cameras.perception is "external"
  external:
    serial: "${oc.env:TIPTOP_EXTERNAL_CAMERA_ID,32439448}"
    type: zed
    resolution: HD720
    fps: 15

  # Second external camera — recorded as DROID exterior_2. Only required when uncommented:
  # tiptop aborts at startup if a configured camera can't open, so no rollout is collected
  # missing a camera. For a deliberate 2-camera setup, just leave this commented out.
  # external_2:
  #   serial: "${oc.env:TIPTOP_EXTERNAL_2_CAMERA_ID,31425515}"
  #   type: zed
  #   resolution: HD720
  #   fps: 15

perception:
  foundation_stereo:
    # PATCHED: we skip FoundationStereo and read ZED HW depth in zed_infer_depth_async
    # This URL is unused but kept for config compatibility.
    url: "http://localhost:1234"

  m2t2:
    # Port overridable per process via env (TIPTOP_M2T2_PORT) so multi-instance runs can each point
    # at their own M2T2 server; defaults to 8123 (single-instance / full_eval). See datagen launcher.
    url: "http://localhost:${oc.env:TIPTOP_M2T2_PORT,8123}"
    apply_bounds: true
    # Confidence floor M2T2 applies when emitting grasps (its `mask_thresh`). 0.035 is M2T2's own
    # default and what tiptop used before this was configurable. Lowering it yields several times
    # more candidates per object -- which is what gives cuTAMP's grasp costs something to choose
    # between -- at the price of admitting grasps M2T2 is less confident in. Settable per data-gen
    # config via `grasp_threshold` in cfg/tamp tamp_overrides.
    grasp_threshold: 0.035
    # How many stochastic M2T2 passes are pooled into one grasp set. 5 is M2T2's own default. This
    # is the strongest lever on how many candidates each object gets and, unlike grasp_threshold, it
    # is quality-neutral -- more samples of the same distribution, not a lower bar. Costs linear
    # wall-clock (~0.9 s at 5, ~3.2 s at 20). Settable per data-gen config via `m2t2_num_runs`.
    num_runs: 5

  sam:
    mode: "local"

  depth_trunc_m: 5.0
  voxel_downsample_size: 0.0075
  contact_threshold_m: 0.01
  mask_erosion_pixels: 3

  # Padding added to each of the robot's cuRobo collision spheres before they are projected into the
  # third-person view and dropped from the point cloud (see project_spheres_to_mask). Covers
  # extrinsics and kinematics error; raise it if a rim of arm survives in the cloud. Unused when the
  # wrist camera does perception — that view uses the painted gripper mask.
  robot_mask_margin_m: 0.02

  # Temporal depth smoothing: at the (static) capture pose we grab num_frames stereo frames
  # back-to-back and per-pixel median-fuse their depth maps to suppress sensor noise / flicker.
  # num_frames = 1 disables smoothing (single-frame behavior).
  depth_smoothing:
    num_frames: 5
